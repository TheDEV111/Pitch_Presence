name: pitchpresence-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${DB_USER:-pitchpresence}:${DB_PASSWORD:-pitchpresence}@database:5432/${DB_NAME:-pitchpresence}
  APP_URL: ${APP_URL:?APP_URL is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  DATA_ENCRYPTION_SECRET: ${DATA_ENCRYPTION_SECRET:?DATA_ENCRYPTION_SECRET is required}
  QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  PAYMENT_MODE: ${PAYMENT_MODE:-MANUAL}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  TRUST_PROXY: ${TRUST_PROXY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-pitchpresence}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pitchpresence}
      POSTGRES_DB: ${DB_NAME:-pitchpresence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pitchpresence}']
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-pitchpresence}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      database:
        condition: service_healthy
    # Connects to both default (internal) and coolify (external proxy) networks.
    # No host `ports:` publish, it is exposed internally and routed by Traefik.
    networks:
      - default
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-pitchpresence}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      <<: *app-env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
      - coolify



networks:
  default: {}
  coolify:
    external: true

volumes:
  postgres_data:
