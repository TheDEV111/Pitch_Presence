services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchpresence
      POSTGRES_PASSWORD: pitchpresence
      POSTGRES_DB: pitchpresence
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitchpresence']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
