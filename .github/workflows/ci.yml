name: Monorepo checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchpresence
          POSTGRES_PASSWORD: pitchpresence
          POSTGRES_DB: pitchpresence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pitchpresence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pitchpresence:pitchpresence@localhost:5432/pitchpresence_test
      TEST_DATABASE_URL: postgresql://pitchpresence:pitchpresence@localhost:5432/pitchpresence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run docs:generate
      - run: git diff --exit-code -- docs/backend/openapi.json
