name: Prepare release media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_LOCAL_MEDIA: 'true'
      NEXT_PUBLIC_LOCAL_FONTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'fonttools[woff]==4.63.0'
      - run: npm ci
      - name: Verify encoding timing and compression recovery
        run: npx vitest run scripts/hero-video-encoding.test.mjs scripts/media-diagnostics.test.mjs scripts/video-master.test.mjs
      - run: npm run media:icons
      - name: Download and finish licensed photography and fonts
        run: npm run media:sync
      - run: npm run build -w @pitchpresence/shared
      - name: Render the clean fifteen-second film from original football footage
        id: render-film
        run: npm run media:video
      - name: Upload film failure diagnostics
        if: >-
          failure() && steps.render-film.outcome == 'failure' &&
          hashFiles('.media-work/render-failure.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: media-render-failure
          path: .media-work/render-failure.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - run: npm run media:verify
      - name: Verify the final production build
        env:
          REQUIRE_LOCAL_MEDIA: 'true'
        run: npm run build -w @pitchpresence/web
      - name: Check browser artifacts for GitHub tokens
        run: npm run security:check:browser
      - run: npx playwright install --with-deps chromium
      - name: Test PWA journeys and actual film playback
        id: browser-tests
        run: npm run test:web -- apps/web/e2e/pwa.spec.ts
      - name: Upload browser traces on failure
        if: >-
          failure() && steps.browser-tests.outcome == 'failure' &&
          (hashFiles('playwright-report/**') != '' || hashFiles('test-results/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: media-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload finished media for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: pitchpresence-release-media
          path: |
            apps/web/public/media/
            apps/web/public/fonts/
            apps/web/public/icons/
          retention-days: 14
          if-no-files-found: error
